name: Data pipeline

# Manual trigger only (no schedule). Fetches approved sources, writes a new run to
# public/data/runs/{run_id}/, commits it back, and keeps raw responses as a 90-day artifact.
on:
  workflow_dispatch:
    inputs:
      city:
        description: City code from pipeline/config/cities.yaml
        required: true
        default: sp

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Offline tests
        run: python -m pytest pipeline/tests -q

      - name: Run pipeline
        id: pipeline
        run: python -m pipeline.access_deserts.run --city "${{ inputs.city }}"

      - name: Upload raw responses (90 days)
        if: always() && steps.pipeline.outputs.run_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ steps.pipeline.outputs.run_id }}
          path: pipeline/cache/raw/${{ steps.pipeline.outputs.run_id }}/
          retention-days: 90
          if-no-files-found: warn

      - name: Commit run output
        if: always() && steps.pipeline.outputs.run_id != ''
        env:
          RUN_ID: ${{ steps.pipeline.outputs.run_id }}
          STATUS: ${{ steps.pipeline.outputs.status }}
          CITY: ${{ inputs.city }}
        # The branch may have moved while the pipeline ran (e.g. another run pushed index.json).
        # Instead of rebasing, keep the new run folder and its index entry, reset to the current
        # remote branch and re-apply them, so index.json never conflicts. Retries if a push races.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r "public/data/runs/${RUN_ID}" "${RUNNER_TEMP}/run"
          python -c "import json, os; i = json.load(open('public/data/runs/index.json', encoding='utf-8')); e = next(r for r in i['runs'] if r['run_id'] == os.environ['RUN_ID']); json.dump(e, open(os.path.join(os.environ['RUNNER_TEMP'], 'entry.json'), 'w', encoding='utf-8'))"
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            rm -rf "public/data/runs/${RUN_ID}"
            mkdir -p public/data/runs
            cp -r "${RUNNER_TEMP}/run" "public/data/runs/${RUN_ID}"
            python -c "import json, os; from pathlib import Path; from pipeline.access_deserts.output import update_index; update_index(Path('public/data/runs'), json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'entry.json'), encoding='utf-8')))"
            git add public/data/runs
            git commit -m "data: pipeline run ${RUN_ID} (${CITY}, ${STATUS})"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((attempt * 10))
          done
          echo "Push failed after 3 attempts; the run is still available as the raw-${RUN_ID} artifact." >&2
          exit 1
