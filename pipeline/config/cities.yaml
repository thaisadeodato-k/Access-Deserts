# City configuration. Adding a city = adding an entry here plus its sources in sources.yaml.

sp:
  name: São Paulo
  state: SP
  ibge_code: "3550308"
  native_crs: EPSG:31983        # SIRGAS 2000 / UTM 23S (DefaultCRS of every GeoSampa layer, GetCapabilities 2026-10-05)
  output_crs: EPSG:4326

  # Plausibility envelope used ONLY to detect CRS / axis-order problems in responses.
  # Derived from the bbox of geoportal:area_contexto feature cd_identificador_area_contexto=27
  # ("São Paulo", identical to the union of geoportal:distrito_municipal), EPSG:31983
  # [313386, 7343738, 360619, 7416133] converted to WGS84 on 2026-10-05.
  # It is NOT the city boundary and is not used for the "% outside boundary" metric.
  wgs84_envelope: [-46.8346, -24.0123, -46.3636, -23.3538]   # [min_lon, min_lat, max_lon, max_lat]

  # City boundary (decided 2026-10-05): union of the 96 district polygons. Checked every run
  # against geoportal:area_contexto feature 27 "São Paulo" (fetched alone via record_filter);
  # area, area difference and symmetric difference go to run.json. area_contexto also holds a
  # second "SÃO PAULO" feature (10027, 1,527.5 km²), not used.
  boundary:
    method: union
    source_id: sp_geosampa_distrito_municipal
    check_against: sp_geosampa_area_contexto

  # Only these hosts may be requested. Hostnames matching internal_host_pattern are never
  # requested; when found in metadata or data they are logged as a quality issue.
  allowed_hosts:
    - wfs.geosampa.prefeitura.sp.gov.br
  internal_host_pattern: '\.prodam$'
