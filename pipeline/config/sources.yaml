# Data sources. Only entries with `approved: true` are used by the pipeline.
#
# Layer names verified in the public GeoSampa WFS GetCapabilities on 2026-10-05;
# `features_at_verification` is the RESULTTYPE=hits count on that date. Field names below were
# confirmed by DescribeFeatureType in the layer inventory (pipeline/discovery/inventory-2026-10-05.md).
#
# Metrics rule (author, 2026-10-05): only services that are public, free at point of use and
# currently existing are counted. Every other record stays in services.geojson with
# included_in_metrics: false and an exclusion_reason.
#
# Roles: service (counted per category, written to services.geojson), context (published for
# display under context/{source_id}.geojson), reference (fetched for checks only), demand (Phase 5).
#
# Optional per-source keys:
#   sort_by:   attribute passed as SORTBY when paging. Needed for layers without a primary key
#              (the server then rejects STARTINDEX). Must be a field confirmed by DescribeFeatureType.
#   page_size: COUNT for this source (default: params.yaml wfs.page_size). Used where the server
#              cannot page at all; a count mismatch is reported as a run error.
#   id_field:  attribute used as the record id instead of the WFS feature id (for layers whose
#              feature ids are generated per request, e.g. "*.fid--…").
#   record_filter: {field, equals}, sent to the server as an OGC filter. The source is only the
#              matching records (e.g. one class of a multi-service layer). The layer total and the
#              kept count are reported in quality.json (record_filter).
#   field_map: maps normalised fields (name, address, type, sphere) to source attributes.
#              type -> equipment_type, sphere -> administrative_sphere in services.geojson.
#              Added only after the source's fields have been reviewed and approved; until then
#              these fields are null.
#   inclusion_rules: list of {field, equals, include, reason}. Records are never dropped: every
#              record stays in services.geojson with `included_in_metrics` and `exclusion_reason`.
#              A record is excluded if it matches any rule with include: false (reasons joined
#              with "; "). Rules with include: true only document and count an explicit decision.
#              Match counts per rule are reported in quality.json.
#   subcategory_rules: list of {field, equals, subcategory}; matching records get that subcategory.
#   venue_grouping: {fields, reason}. Records with the same normalised value of `fields` (lower
#              case, punctuation removed) are one venue; one record per venue is counted and the
#              others are excluded with `reason`. Each record gets a venue_id.
#   record_overrides: list of {feature_id, include, reason, evidence, approved_on}. Replaces the
#              rule result for ONE record (record id: id_field value, else WFS feature id). Only added
#              after the author approves it, with the evidence cited. Reported in quality.json
#              (inclusion.overrides) and on the Method page. Cannot include a record without coordinates.
#   placeholder_values: {field: [values]} replaced by null before normalising and profiling. Only
#              for fields where the value is clearly a placeholder, never in yes/no fields.
#   derived_name: {from_source, field}. When the source has no name field, the record takes the
#              name of the area (from another approved source) that contains it, only for one-to-one
#              matches; flagged name_derived: true; counts and method in quality.json.
#   map_initially_hidden: true for heavy layers (file loaded by the map only when switched on).
#   highlight_fields: {attribute: label}. The attribute's empty share is reported as a
#              highlighted finding in quality.json (computed each run).

defaults:
  city_code: sp
  publisher: GeoSampa – Prefeitura de São Paulo (SMUL/Geoinfo)
  endpoint_url: http://wfs.geosampa.prefeitura.sp.gov.br/geoserver/geoportal/wfs
  protocol: wfs
  approved: false

sources:
  # ---- Services ----------------------------------------------------------------------------
  # Education layers: nm_esfera_administrativa_equipamento contradicts the type (state schools
  # "MUNICIPAL", municipal schools and all CEU units "PRIVADA"), so sphere is not mapped.
  - source_id: sp_geosampa_educacao_rede_publica
    name: Public primary and secondary schools
    layer: geoportal:equipamento_educacao_rede_publica
    role: service
    category: school
    subcategory: primary_secondary
    features_at_verification: 1590
    approved: true   # approved 2026-10-05 (Phase 4)
    field_map:
      name: nm_equipamento
      address: [tx_endereco_equipamento, nm_bairro_equipamento, cd_cep_equipamento]
      type: nm_tipo_equipamento
    highlight_fields:
      tx_horario_funcionamento: Opening hours

  - source_id: sp_geosampa_educacao_infantil
    name: Public early-childhood education
    layer: geoportal:equipamento_educacao_infantil_rede_publica
    role: service
    category: school
    subcategory: early_childhood
    features_at_verification: 3047
    approved: true   # approved 2026-10-05 (Phase 4)
    sort_by: cd_identificador   # no primary key: STARTINDEX needs SORTBY (unique, inventory 2026-10-05)
    id_field: cd_identificador  # WFS feature ids are generated per request
    field_map:
      name: nm_equipamento
      address: [tx_endereco_equipamento, nm_bairro_equipamento, cd_cep_equipamento]
      type: nm_tipo_equipamento
    subcategory_rules:          # partner crèches: included (author decision 2026-10-05)
      - field: nm_tipo_equipamento
        equals: CR.P.CONV
        subcategory: partner_network
    highlight_fields:
      tx_horario_funcionamento: Opening hours

  - source_id: sp_geosampa_educacao_ceu
    name: CEU (Unified Educational Centres)
    layer: geoportal:equipamento_educacao_ceu
    role: service
    category: school
    subcategory: ceu
    features_at_verification: 150
    approved: true   # approved 2026-10-05 (Phase 4)
    field_map:
      name: nm_equipamento
      address: [tx_endereco_equipamento, nm_bairro_equipamento, cd_cep_equipamento]
      type: nm_tipo_equipamento
    highlight_fields:
      tx_horario_funcionamento: Opening hours

  - source_id: sp_geosampa_saude_ubs
    name: Basic health units (UBS / health posts / health centres)
    layer: geoportal:equipamento_saude_ubs_posto_centro
    role: service
    category: health_ubs
    subcategory: null
    features_at_verification: 483
    approved: true   # approved 2026-10-05 (Phase 2)
    field_map:       # approved 2026-10-05; type and sphere approved 2026-10-05 (Phase 4 plan)
      name: nm_equipamento
      address: [tx_endereco_equipamento, nm_bairro_equipamento, cd_cep_equipamento]
      type: nm_tipo_equipamento
      sphere: nm_esfera_administrativa_equipamento
    inclusion_rules: # approved 2026-10-05; all records stay in services.geojson
      - field: nm_esfera_administrativa_equipamento
        equals: Estadual
        include: true
        reason: state-run (public service)
      - field: nm_esfera_administrativa_equipamento
        equals: Privado
        include: false
        reason: private provider
      - field: nm_tipo_equipamento
        equals: SEM TIPO
        include: false
        reason: missing type, needs review
    record_overrides: [] # none (author decision 2026-10-05): the two state-run "SEM TIPO" centres
                         # stay excluded and are listed as a known limitation in pipeline/findings.md.
    highlight_fields: # reported as highlighted findings in quality.json
      tx_horario_funcionamento: Opening hours

  # CRAS locations: one class of the social assistance facilities layer (approved 2026-10-05).
  # The layer has no unit-name field: nm_equipamento holds the operator ("PREFEITURA MUNICIPAL DE
  # SAO PAULO" for all CRAS), so name is not mapped.
  - source_id: sp_geosampa_cras
    name: Social assistance reference centres (CRAS)
    layer: geoportal:equipamento_assistencia_social
    role: service
    category: cras
    subcategory: null
    features_at_verification: 54   # records of the CRAS class (layer total 1,336)
    approved: true
    record_filter:
      field: nm_classe_equipamento
      equals: CENTRO DE REFERÊNCIA DE ASSISTÊNCIA SOCIAL - CRAS
    field_map:
      address: [tx_endereco_equipamento, cd_cep_equipamento]
      type: nm_classe_equipamento
    placeholder_values:   # "No" in 100% of records; none is a yes/no field (approved 2026-10-05)
      cd_equipamento: ["No"]
      nm_bairro_equipamento: ["No"]
      tx_horario_funcionamento: ["No"]
      tx_numero_telefone: ["No"]
      cd_equipamento_base_origem: ["No"]
    derived_name:         # approved 2026-10-05; 5 Oct data: 50 of 54 named (1:1 matches only)
      from_source: sp_geosampa_cras_coverage
      field: nm_cras

  - source_id: sp_geosampa_parque_municipal
    name: Municipal parks
    layer: geoportal:pde_parque_municipal
    role: service
    category: park_square
    subcategory: park
    features_at_verification: 280
    approved: true   # approved 2026-10-05 (Phase 4)
    field_map:
      name: nm_parque
      type: tx_tipo_categoria_parque_unidade_conservacao
    inclusion_rules:
      - field: tx_tipo_situacao_projeto
        equals: Proposto
        include: false
        reason: planned, not built

  - source_id: sp_geosampa_praca_largo
    name: Squares and plazas
    layer: geoportal:GEOSAMPA_v_praca_largo
    role: service
    category: park_square
    subcategory: square
    features_at_verification: 3830
    approved: true   # approved 2026-10-05 (Phase 4)
    page_size: 5000  # STARTINDEX > 0 returns empty pages (even with SORTBY); one request returns all
    map_initially_hidden: true   # ≈ 6 MB of polygons
    field_map:
      name: nome
      address: [endereco1, bairro, cep1]
      type: categoria

  - source_id: sp_geosampa_bibliotecas
    name: Libraries
    layer: geoportal:equipamento_cultura_bibliotecas
    role: service
    category: library
    subcategory: null
    features_at_verification: 192
    approved: true   # approved 2026-10-05 (Phase 4)
    field_map:
      name: nm_equipamento
      address: [tx_endereco_equipamento, cd_cep_equipamento]
      type: nm_tipo_equipamento
      sphere: nm_esfera_administrativa_equipamento
    inclusion_rules:
      - field: nm_esfera_administrativa_equipamento
        equals: Particular
        include: false
        reason: private provider
    highlight_fields:
      tx_horario_funcionamento: Opening hours

  - source_id: sp_geosampa_espacos_culturais
    name: Cultural spaces
    layer: geoportal:equipamento_cultura_espacos_culturais
    role: service
    category: culture
    subcategory: cultural_space
    features_at_verification: 35
    approved: true   # approved 2026-10-05 (Phase 4)
    field_map:
      name: nm_equipamento
      address: [tx_endereco_equipamento, cd_cep_equipamento]
      type: nm_tipo_equipamento
      sphere: nm_esfera_administrativa_equipamento
    inclusion_rules:
      - field: nm_esfera_administrativa_equipamento
        equals: Particular
        include: false
        reason: private provider
    highlight_fields:
      tx_horario_funcionamento: Opening hours

  - source_id: sp_geosampa_museus
    name: Museums
    layer: geoportal:equipamento_cultura_museus
    role: service
    category: culture
    subcategory: museum
    features_at_verification: 167
    approved: true   # approved 2026-10-05 (Phase 4)
    field_map:
      name: nm_equipamento
      address: [tx_endereco_equipamento, cd_cep_equipamento]
      type: nm_tipo_equipamento
      sphere: nm_esfera_administrativa_equipamento
    inclusion_rules:
      - field: nm_esfera_administrativa_equipamento
        equals: Particular
        include: false
        reason: private provider
    highlight_fields:
      tx_horario_funcionamento: Opening hours

  - source_id: sp_geosampa_teatro_cinema_show
    name: Theatres, cinemas and venues
    layer: geoportal:equipamento_cultura_teatro_cinema_show
    role: service
    category: culture
    subcategory: theatre_cinema
    features_at_verification: 410   # one record per room; 107 venues by address (inventory 2026-10-05)
    approved: true   # approved 2026-10-05 (Phase 4)
    field_map:
      name: nm_equipamento
      address: [tx_endereco_equipamento, cd_cep_equipamento]
      type: nm_tipo_equipamento
      sphere: nm_esfera_administrativa_equipamento
    inclusion_rules:
      - field: nm_esfera_administrativa_equipamento
        equals: Particular
        include: false
        reason: private provider
    venue_grouping:  # count venues, not rooms (author decision 2026-10-05)
      fields: [tx_endereco_equipamento]
      reason: another room of the same venue (venue counted once)
    highlight_fields:
      tx_horario_funcionamento: Opening hours

  - source_id: sp_geosampa_estacao_metro
    name: Metro stations
    layer: geoportal:estacao_metro
    role: service
    category: metro_train
    subcategory: metro
    features_at_verification: 94   # interchange stations appear once per line
    approved: true   # approved 2026-10-05 (Phase 4)
    field_map:
      name: nm_estacao_metro_trem
      type: nm_linha_metro_trem

  - source_id: sp_geosampa_estacao_trem
    name: Train stations (CPTM and ViaMobilidade)
    layer: geoportal:estacao_trem
    role: service
    category: metro_train
    subcategory: train
    features_at_verification: 109   # interchange stations appear once per line
    approved: true   # approved 2026-10-05 (Phase 4, transit)
    field_map:
      name: nm_estacao_metro_trem
      type: nm_linha_metro_trem

  - source_id: sp_geosampa_ponto_onibus
    name: Bus stops
    layer: geoportal:ponto_onibus
    role: service
    category: transit
    subcategory: bus_stop
    features_at_verification: 22570
    approved: true   # approved 2026-10-05 (Phase 4, transit)
    sort_by: cd_identificador_ponto_onibus   # no primary key; unique (inventory 2026-10-05)
    id_field: cd_identificador_ponto_onibus  # WFS feature ids are generated per request
    map_initially_hidden: true   # 22,570 points, ≈ 10 MB
    field_map:
      name: nm_ponto_onibus
      address: tx_endereco_ponto_onibus

  - source_id: sp_geosampa_terminal_onibus
    name: Bus terminals
    layer: geoportal:terminal_onibus
    role: service
    category: transit
    subcategory: bus_terminal
    features_at_verification: 50
    approved: true   # approved 2026-10-05 (Phase 4, transit)
    field_map:
      name: nm_terminal
      address: tx_endereco_terminal
      type: nm_tipo_terminal
    inclusion_rules:
      - field: nm_tipo_terminal
        equals: RODOVIARIO
        include: false
        reason: intercity terminal, not daily access

  # ---- Context (never counted as services) ---------------------------------------------------
  - source_id: sp_geosampa_distrito_municipal
    name: Municipal districts
    layer: geoportal:distrito_municipal
    role: context
    category: null
    subcategory: null
    features_at_verification: 96
    approved: true   # approved 2026-10-05 (Phase 4); its union is the city boundary
    field_map:
      name: nm_distrito_municipal

  - source_id: sp_geosampa_area_contexto
    name: São Paulo municipality (area_contexto feature 27, boundary check)
    layer: geoportal:area_contexto
    role: reference
    category: null
    subcategory: null
    features_at_verification: 1359   # whole layer: all municipalities of the state (86 MB)
    approved: true   # approved 2026-10-05 (Phase 4): only the São Paulo feature is fetched
    sort_by: cd_identificador_area_contexto   # no primary key: STARTINDEX needs SORTBY
    id_field: cd_identificador_area_contexto  # WFS feature ids are generated per request
    record_filter:
      field: cd_identificador_area_contexto
      equals: 27

  - source_id: sp_geosampa_corredor_onibus
    name: Bus corridors in operation (display only)
    layer: geoportal:corredor_onibus
    role: context
    category: null
    subcategory: null
    features_at_verification: 45
    approved: true   # approved 2026-10-05 (Phase 4): display only "Em Operação"
    record_filter:
      field: dc_tipo_status_corredor_onibus
      equals: Em Operação
    field_map:
      name: nm_corredor
      type: nm_origem

  - source_id: sp_geosampa_cras_coverage
    name: CRAS coverage areas (not facility locations)
    layer: geoportal:centro_referencia_assistencia_social
    role: reference
    category: null
    subcategory: null
    features_at_verification: 58
    approved: true   # 2026-10-05, only as the source of derived CRAS names (not published, not counted)
    notes: >-
      58 polygons of CRAS coverage areas (qt_area_abrangencia_centro), not service locations
      (inventory 2026-10-05). Was configured as the CRAS service source until then.

  # ---- Demand (Phase 5, approved 2026-10-05) -----------------------------------------------------
  - source_id: sp_geosampa_densidade_demografica
    name: Census tracts 2022 – geometry, population check and IPVS 2022
    layer: geoportal:densidade_demografica
    role: demand
    category: null
    subcategory: null
    features_at_verification: 27301
    approved: true
    sort_by: cd_identificador
    id_field: cd_original_setor_censitario

  - source_id: sp_ibge_basico
    name: IBGE Census 2022 – basic aggregates by tract (population, households)
    publisher: IBGE – Censo Demográfico 2022
    layer: Agregados_por_setores_basico_BR.csv
    endpoint_url: https://ftp.ibge.gov.br/Censos/Censo_Demografico_2022/Agregados_por_Setores_Censitarios/Agregados_por_Setor_csv/Agregados_por_setores_basico_BR_20260520.zip
    protocol: csv
    role: demand
    category: null
    subcategory: null
    features_at_verification: 27301   # São Paulo tracts (5 Oct 2026)
    approved: true
    csv: {member: Agregados_por_setores_basico_BR.csv, encoding: latin-1, delimiter: ";", decimal: ",",
          key: CD_SETOR, columns: [v0001, v0007]}

  - source_id: sp_ibge_renda
